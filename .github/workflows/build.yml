name: Build Haxe & Haxelib for Termux (ARM64 Complete)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Haxe Binary
        run: |
          eval $(opam env)
          make haxe static=1 CFLAGS="-O2"

      - name: Build Haxelib Binary
        run: |
          eval $(opam env)
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            gcc -O2 "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO -lpcre2-8 -lz -lmbedcrypto -lmbedx509 -lmbedtls || \
            gcc -O2 "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO
          fi

      - name: Bundle Required Libraries (.so files)
        run: |
          mkdir -p libs
          # جمع جميع المكتبات التي يحتاجها haxe لضمان عمله دون خطأ المكتبات المفقودة
          cp -L /usr/lib/aarch64-linux-gnu/libmbed* libs/ 2>/dev/null || true
          cp -L /usr/lib/aarch64-linux-gnu/libpcre2* libs/ 2>/dev/null || true
          cp -L /usr/lib/aarch64-linux-gnu/libz* libs/ 2>/dev/null || true

      - name: Upload Binaries & Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-arm64-bundle
          path: |
            haxe
            haxelib
            libs/
