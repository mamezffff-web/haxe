name: Build Haxe 5.0.0 Pure Android Bionic (NDK Toolchain)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git wget unzip pkg-config file cmake

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          NDK_PATH="$PWD/android-ndk-r26c"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build Android Libraries for Bionic (PCRE2, Zlib, mbedtls)
        run: |
          TOOLCHAIN="$NDK_HOME/build/cmake/android.toolchain.cmake"

          # 1. بناء PCRE2
          wget -q https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.gz
          tar -xzf pcre2-10.42.tar.gz
          cd pcre2-10.42
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
                   -DANDROID_ABI=arm64-v8a \
                   -DANDROID_PLATFORM=android-24 \
                   -DCMAKE_INSTALL_PREFIX=$PWD/install \
                   -DPCRE2_BUILD_PCRE2_8=ON \
                   -DPCRE2_BUILD_PCRE2GREP=OFF \
                   -DPCRE2_BUILD_TESTS=OFF \
                   -Wno-dev
          make -j$(nproc) && make install
          cd ../..
          echo "PCRE2_DIR=$PWD/pcre2-10.42/build/install" >> $GITHUB_ENV

          # 2. بناء Zlib
          wget -q https://zlib.net/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
                   -DANDROID_ABI=arm64-v8a \
                   -DANDROID_PLATFORM=android-24 \
                   -DCMAKE_INSTALL_PREFIX=$PWD/install \
                   -Wno-dev
          make -j$(nproc) && make install
          cd ../..
          echo "ZLIB_DIR=$PWD/zlib-1.3.1/build/install" >> $GITHUB_ENV

          # 3. بناء mbedtls
          wget -q https://github.com/Mbed-TLS/mbedtls/archive/v3.5.0.tar.gz
          tar -xzf v3.5.0.tar.gz
          cd mbedtls-3.5.0
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
                   -DANDROID_ABI=arm64-v8a \
                   -DANDROID_PLATFORM=android-24 \
                   -DCMAKE_INSTALL_PREFIX=$PWD/install \
                   -DENABLE_PROGRAMS=OFF \
                   -DENABLE_TESTING=OFF \
                   -Wno-dev
          make -j$(nproc) && make install
          cd ../..
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.5.0/build/install" >> $GITHUB_ENV

      - name: Configure OPAM & Build Haxe for Android Bionic
        run: |
          eval $(opam env)
          opam install . --deps-only -y
          
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          
          make haxe CC=aarch64-linux-android24-clang CXX=aarch64-linux-android24-clang++ STATICLINK=1

      - name: Build Haxelib (Static Bionic)
        run: |
          eval $(opam env)
          
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            aarch64-linux-android24-clang "$RUN_C_PATH" -o haxelib \
              -I"$HAXELIB_DIR" -DNO_NEKO \
              -I"$PCRE2_DIR/include" -L"$PCRE2_DIR/lib" -lpcre2-8 \
              -I"$ZLIB_DIR/include" -L"$ZLIB_DIR/lib" -lz \
              -I"$MBEDTLS_DIR/include" -L"$MBEDTLS_DIR/lib" -lmbedtls -lmbedx509 -lmbedcrypto \
              -lm || echo "⚠️ فشل بناء haxelib"
          fi

      - name: Verify Built Binaries
        run: |
          echo "🔍 الفحص المباشر لهوية الملفات الناتجة:"
          file haxe || true
          file haxelib || true
          echo ""
          echo "📏 حجم الملفات:"
          ls -lh haxe haxelib 2>/dev/null || true

      - name: Upload True Android Bionic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haxe-android-bionic-final
          path: |
            haxe
            haxelib
