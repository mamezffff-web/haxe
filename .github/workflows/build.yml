name: Build Haxe 5.0.0 for Android ARM64 (Pure Bionic / Static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Fully Static Haxe 5.0.0 Binary
        run: |
          eval $(opam env)
          # استخدام STATICLINK والربط الساكن للثنائيات لمنع الاعتماد على GLIBC
          make haxe static=1 STATICLINK=1 CFLAGS="-O2 -static" LDFLAGS="-static"

      - name: Build Fully Static Haxelib Binary
        run: |
          eval $(opam env)
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            # تجميع haxelib مع -static لمنع الاعتماد على مكتبات النظام الخارجية
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO -lpcre2-8 -lz -lmbedcrypto -lmbedx509 -lmbedtls -lm -ldl || \
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO -lm -ldl
          fi

      - name: Upload Native Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe5-arm64-bionic-static
          path: |
            haxe
            haxelib
