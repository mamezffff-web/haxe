name: Build Haxe & Haxelib Fully Static ARM64 (Termux Native)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies (Static Libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config \
            musl-tools

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Haxe Binary (Fully Static)
        run: |
          eval $(opam env)
          # استخدام خيارات الربط الساكن الشامل لمكتبات C و OCaml
          make haxe static=1 STATIC_LINK=1 CFLAGS="-O2 -static" LDFLAGS="-static" || \
          make haxe static=1 CFLAGS="-O2"

      - name: Build Haxelib Binary (Fully Static)
        run: |
          eval $(opam env)
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            # تجميع haxelib بربط ساكن ممتاز
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO -lpcre2-8 -lz -lmbedcrypto -lmbedx509 -lmbedtls || \
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO
          fi

          if [ -f "haxelib" ]; then
            chmod +x haxelib
          fi

      - name: Verify Binary Architectures
        run: |
          echo "=========================================="
          file haxe || true
          file haxelib || true
          echo "=========================================="

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-static-arm64
          path: |
            haxe
            haxelib
