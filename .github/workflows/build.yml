name: Build Truly Static Haxe for Termux (Musl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Musl and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools make gcc g++ pkg-config

      - name: Setup OCaml Environment with Musl
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Static Haxe Binary
        run: |
          eval $(opam env)
          # إجبار التجميع عبر Musl للربط الساكن المطلق
          CC=musl-gcc make haxe static=1 STATIC_LINK=1 CFLAGS="-O2 -static" LDFLAGS="-static" || \
          make haxe static=1 CFLAGS="-O2 -static" LDFLAGS="-static"

      - name: Build Static Haxelib Binary
        run: |
          eval $(opam env)
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            musl-gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO || \
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO
          fi

      - name: Upload Truly Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-musl-static-arm64
          path: |
            haxe
            haxelib
