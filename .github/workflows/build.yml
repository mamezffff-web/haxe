name: Build Haxe & Haxelib ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Forked Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies & Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Haxe Binary for ARM64
        run: |
          eval $(opam env)
          make haxe CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ static=1

      - name: Smart Build Haxelib Binary
        run: |
          eval $(opam env)
          
          # 1. البحث الذكي عن مكان ملف run.c
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          
          echo "=========================================="
          echo "Found run.c at: $RUN_C_PATH"
          echo "=========================================="

          # 2. التجميع المباشر إن وُجد الملف، أو تحذير إذا لم يوجد بدون إيقاف السكربت مفاجأة
          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            aarch64-linux-gnu-gcc -O2 "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO || echo "Failed to build haxelib, continuing..."
          else
            echo "Warning: run.c not found, skipping haxelib compilation."
          fi

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-arm64-full
          path: |
            haxe
            haxelib
