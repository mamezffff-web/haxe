name: Build Haxe & Haxelib ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Forked Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies & Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Haxe Binary for ARM64
        run: |
          eval $(opam env)
          make haxe CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ static=1

      - name: Build Haxelib Binary for ARM64
        run: |
          eval $(opam env)
          cd extra/haxelib_src
          ../../haxe client.hxml
          aarch64-linux-gnu-gcc -O2 run.c -o ../../haxelib -I. -DNO_NEKO

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-arm64-full
          path: |
            haxe
            haxelib
