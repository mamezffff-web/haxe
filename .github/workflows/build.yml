name: Build Haxe & Haxelib for Termux (ARM64 Bionic Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    # استخدام خوادم ARM64 المباشرة المتاحة مجاناً في GitHub
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OCaml Environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            libpcre2-dev \
            zlib1g-dev \
            libmbedtls-dev \
            pkg-config

      - name: Install OPAM Dependencies
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test -y

      - name: Build Haxe Binary
        run: |
          eval $(opam env)
          # بناء Haxe بربط ساكن متوافق مع Termux/Bionic
          make haxe static=1 CFLAGS="-O2"

      - name: Build Haxelib Binary (Static / Bionic Compatible)
        run: |
          eval $(opam env)
          
          # 1. البحث عن مكان ملف run.c الخاضع لـ haxelib
          RUN_C_PATH=$(find . -name "run.c" | head -n 1)
          
          echo "=========================================="
          echo "Found run.c at: $RUN_C_PATH"
          echo "=========================================="

          if [ -n "$RUN_C_PATH" ]; then
            HAXELIB_DIR=$(dirname "$RUN_C_PATH")
            # تجميع haxelib بربط ساكن (-static) لتجنب التعارض مع glibc ويعمل على Termux مباشرة
            gcc -O2 -static "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO || \
            gcc -O2 "$RUN_C_PATH" -o haxelib -I"$HAXELIB_DIR" -DNO_NEKO
          else
            echo "Warning: run.c not found, trying alternative build..."
          fi

          # التحقق من وجود الملف
          if [ -f "haxelib" ]; then
            echo "SUCCESS: haxelib binary created successfully!"
            chmod +x haxelib
          else
            echo "ERROR: haxelib build failed."
          fi

      - name: Verify Binary Architectures
        run: |
          echo "=========================================="
          echo "Verifying file types:"
          file haxe || true
          file haxelib || true
          echo "=========================================="

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxe-haxelib-arm64-termux
          path: |
            haxe
            haxelib
